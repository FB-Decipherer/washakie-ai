<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found · Three Columns</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFAF5; --card:#F5F1E8; --ink:#1E1B16; --ink-mid:#4A443A;
  --rule:#DCD5C6; --accent:#4C7A4E; --accentb:#B4372C; --gold:#C8992F;
  --dead:#8A8177;
}
:root[data-theme="dark"]{
  --paper:#15130F; --card:#1E1B16; --ink:#F2EDE3; --ink-mid:#B7AF9F;
  --rule:#38332A; --accent:#7FA981; --accentb:#D2695C; --gold:#D9B45C;
  --dead:#6B655B;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.62;}
.wrap{max-width:1560px;margin:0 auto;padding:0 26px;}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule);}
a:hover{border-bottom-color:var(--accent);}

/* ---------- header ---------- */
header{padding:38px 0 4px;}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);
  display:flex;align-items:center;gap:.4em;}
.eyebrow .sep{opacity:.55;font-family:"Source Serif 4",serif;font-size:1.5em;line-height:0;}
.mark{width:22px;height:22px;flex:none;}
h1{font-size:clamp(30px,4.4vw,48px);line-height:1.12;font-weight:600;margin:14px 0 0;
  letter-spacing:-.012em;}
h1 .sep{color:var(--accent);font-weight:400;padding:0 .18em;}
h1 .seg{display:inline-block;}
.claimlabel{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-top:20px;}
.standfirst{font-size:20px;line-height:1.5;color:var(--ink-mid);margin:8px 0 0;max-width:62ch;}
.standfirst strong{display:inline-block;margin-top:10px;font-weight:600;color:var(--ink);}
.asof{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-mid);
  border:1px solid var(--rule);border-radius:999px;padding:5px 13px;display:inline-block;margin-top:20px;}

/* ---------- nav ---------- */
nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  margin-top:26px;padding:11px 0;position:sticky;top:0;background:var(--paper);z-index:20;}
button{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.06em;
  background:none;border:1px solid var(--rule);color:var(--ink-mid);
  padding:8px 15px;border-radius:6px;cursor:pointer;}
button:hover{border-color:var(--accent);color:var(--ink);}
button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
button .key{color:var(--gold);font-weight:500;margin-right:.55em;}
button[aria-selected="true"] .key{color:var(--gold);}
nav .spacer{flex:1;}
.util{font-size:11.5px;padding:7px 12px;}

/* ---------- the three columns ---------- */
main{display:grid;gap:0 34px;padding:30px 0 10px;
  grid-template-columns:1fr minmax(280px,.82fr) 1fr;}
.col{min-width:0;}
.col + .col{border-left:1px solid var(--rule);padding-left:34px;}
.colhead{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-mid);padding-bottom:9px;
  border-bottom:2px solid var(--ink);margin-bottom:20px;
  position:sticky;top:52px;background:var(--paper);}
.colhead b{color:var(--gold);font-weight:500;}
.col.dim{opacity:.42;}
h2{font-size:22px;font-weight:600;margin:30px 0 6px;letter-spacing:-.006em;}
h2:first-of-type{margin-top:0;}
h3{font-size:15.5px;font-weight:600;margin:24px 0 4px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.02em;color:var(--accent);}
p{margin:9px 0 0;}
.lede{font-size:18px;color:var(--ink-mid);}
ul,ol{margin:9px 0 0;padding-left:20px;}
li{margin:5px 0;}
.mono{font-family:"IBM Plex Mono",monospace;font-size:.9em;}
pre{font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.5;
  background:var(--card);border:1px solid var(--rule);border-radius:7px;
  padding:13px 15px;overflow-x:auto;margin:12px 0 0;}
.note{margin-top:18px;padding:14px 16px;background:var(--card);
  border-left:3px solid var(--accent);border-radius:0 7px 7px 0;}

details{border-top:1px solid var(--rule);}
details:last-of-type{border-bottom:1px solid var(--rule);}
summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;
  display:flex;gap:.6em;align-items:baseline;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"+";font-family:"IBM Plex Mono",monospace;color:var(--accent);flex:none;}
details[open] summary::before{content:"−";}
details .body{padding:0 0 14px 1.5em;}

/* footnote markers */
.fn{font-family:"IBM Plex Mono",monospace;font-size:.72em;vertical-align:super;
  color:var(--accentb);border:0;padding:0 .12em;cursor:pointer;font-weight:500;}
.fn:hover{text-decoration:underline;}

/* ---------- reference blocks (column B) ---------- */
.ref{border:1px solid var(--rule);border-radius:9px;padding:15px 16px;margin-bottom:15px;
  background:var(--card);scroll-margin-top:100px;}
.ref.flash{border-color:var(--accentb);box-shadow:0 0 0 3px rgba(180,55,44,.14);}
.rnum{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accentb);font-weight:500;}
.rkind{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-mid);display:inline;margin-left:.7em;}
.rtitle{font-size:17px;font-weight:600;margin-top:7px;line-height:1.3;}
.rmeta{font-size:13.5px;color:var(--ink-mid);margin-top:4px;font-style:italic;}
.rprev{font-size:14.5px;margin-top:9px;}
.rwhy{font-size:14.5px;margin-top:7px;color:var(--ink-mid);}
.rwhy b{color:var(--ink);font-weight:600;}
.rlink{display:block;margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  padding:8px 11px;border:1px solid var(--rule);border-radius:6px;
  background:var(--paper);word-break:break-all;border-bottom:1px solid var(--rule);}
.rlink:hover{border-color:var(--accent);}
.rlink::before{content:"→ ";color:var(--accent);}
.rlink.broken{color:var(--dead);border-style:dashed;cursor:not-allowed;
  text-decoration:line-through;pointer-events:none;}
.rlink.broken::before{content:"× ";color:var(--dead);}
#deadnote{margin-top:22px;padding:13px 15px;border:1px dashed var(--rule);border-radius:7px;
  font-size:14px;color:var(--ink-mid);}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:var(--card);padding:28px 26px 32px;margin-top:54px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.9;color:var(--ink-mid);
  text-align:center;}
footer strong{color:var(--ink);letter-spacing:.04em;}
.endmark{text-align:center;padding:26px 0 58px;color:var(--ink-mid);}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  main{grid-template-columns:1fr;gap:0;}
  .col + .col{border-left:0;padding-left:0;border-top:1px solid var(--rule);
    margin-top:34px;padding-top:26px;}
  .col{display:none;}
  .col.active{display:block;}
  .col.dim{opacity:1;}
  .colhead{position:static;}
}
@media print{
  nav,.endmark{display:none;}
  .col{display:block!important;opacity:1!important;}
  main{grid-template-columns:1fr;}
  .col + .col{border-left:0;padding-left:0;page-break-before:always;}
  details{border:0;} details .body{display:block!important;padding-left:0;}
  summary::before{content:"";}
  body{background:#fff;color:#000;font-size:11pt;}
}
</style>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.box{max-width:560px;padding:0 26px;}
.big{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accentb);}
h1{font-size:38px;margin:12px 0 0;font-weight:600;letter-spacing:-.012em;}
p{margin:14px 0 0;color:var(--ink-mid);font-size:17.5px;}
.home{display:inline-block;margin-top:26px;font-family:"IBM Plex Mono",monospace;
  font-size:13px;padding:10px 16px;border:1px solid var(--rule);border-radius:7px;
  background:var(--card);}
.home:hover{border-color:var(--accent);}
.bars{display:flex;gap:5px;margin-bottom:22px;}
.bars i{width:26px;height:60px;border-radius:3px;display:block;}
</style>
</head>
<body>
<div class="box">
  <div class="bars"><i style="background:#4C7A4E"></i><i style="background:#C8992F"></i><i style="background:#B4372C;opacity:.28"></i></div>
  <div class="big">404 &middot; nothing at this address</div>
  <h1>That page isn&rsquo;t here.</h1>
  <p>Either the address has a typo in it, or something moved. Nothing is deleted on
  this site &mdash; pages are superseded rather than removed &mdash; so if you followed
  a link that used to work, it has been renamed rather than thrown away.</p>
  <a class="home" href="/">&larr; back to the start</a>
</div>
</body>
</html>
