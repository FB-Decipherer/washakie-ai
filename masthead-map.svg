<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 506" role="img"
     aria-label="Schematic map of Wyoming. Washakie County is marked in the north center with the ten thousand dollar request. Cheyenne and Laramie, in the far southeast, are marked with the 1.8 gigawatt data center, its four hundred jobs, and the university AI initiative's four million dollars.">
  <style>
    text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    .nm{font-size:19px;font-weight:600;fill:#FFFDFA}
    .rl{font-size:13.5px;font-family:Georgia,serif;fill:#FFFDFA;opacity:.88}
    .pl{font-size:16px;font-weight:700;font-family:Georgia,serif;fill:#5C554B}
  </style>

  <!-- Wyoming, to scale: 360 by 280 miles -->
  <defs>
    <clipPath id="wy"><rect x="40" y="26" width="600" height="466" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#wy)">
    <g transform="translate(40 26) scale(25 19.4167)">
      <rect width="24" height="24" fill="#F4EDE0"/>
      <path d="M0 0 H15 C13 4 14 8 11 11 C8 14 9 19 6 24 H0 Z" fill="#E9EEDF"/>
      <path d="M9 0 C11 3 11 6 9.5 8.5 C8 11 8.5 13 7 15 L4 15 C5 11 5 6 4 0 Z" fill="#F1E7D6"/>
      <path d="M0 0 H6 C5.5 5 6 10 4 14 C2.5 17 2 21 2.5 24 H0 Z" fill="#DCE6D2"/>
      <path d="M0 2 H3.6 C3.4 6 3.6 10 2 13.5 C1 15.7 0.6 18 0.7 20 H0 Z" fill="#CEDCC6"/>
      <path d="M9.4 0 C11 2.5 11.2 6 10 8.6 C9.4 9.9 9 11 8.9 12 L10.6 12.4 C11 10.6 11.8 8.6 12.4 6.6 C13 4.4 13.2 2 13 0 Z" fill="#DCE6D2"/>
      <path d="M17 24 C17.4 21 18.6 19 20.4 18 C22 17.1 23.2 17 24 17.2 V24 Z" fill="#E4EBDC"/>
      <path d="M1.2 1.2 C2.4 1.1 3.2 1.8 3.1 2.8 C3 3.8 2 4.3 1.1 3.9 C0.4 3.6 0.3 2 1.2 1.2 Z" fill="#D5E2E6"/>
      <g fill="none" stroke="#B7C3AC" stroke-width="0.07" opacity=".8">
        <path d="M6.1 0 C5.6 5 6 10 4.1 14 C2.6 17 2.1 21 2.6 24"/>
        <path d="M3.7 2 C3.5 6 3.7 10 2.1 13.5 C1.1 15.7 0.7 18 0.8 20"/>
        <path d="M15 0 C13 4 14 8 11 11 C8 14 9 19 6 24"/>
        <path d="M13 0 C13.2 2.4 12.9 4.6 12.3 6.7 C11.7 8.7 11 10.7 10.6 12.4"/>
        <path d="M17 24 C17.5 21 18.7 19 20.5 18 C22 17.1 23.2 17 24 17.2"/>
      </g>
    </g>
  </g>
  <rect x="40" y="26" width="600" height="466" rx="3" fill="none" stroke="#8A8175" stroke-width="2"/>

  <!-- Washakie County: the subject -->
  <rect x="166" y="106" width="280" height="76" rx="4" fill="#4A5A4B"/>
  <text x="306" y="137" text-anchor="middle" class="nm">Washakie County</text>
  <text x="306" y="161" text-anchor="middle" class="rl">7,600 people &#183; asking $10,000</text>
  <circle cx="306" cy="200" r="4.5" fill="#4A5A4B"/>
  <text x="306" y="226" text-anchor="middle" class="pl">Worland</text>

  <!-- The southeast corner: where the money is -->
  <rect x="316" y="330" width="304" height="96" rx="4" fill="#A8461E"/>
  <text x="468" y="361" text-anchor="middle" class="nm">Cheyenne &#183; Laramie</text>
  <text x="468" y="385" text-anchor="middle" class="rl">1.8 GW data center &#183; 400 jobs</text>
  <text x="468" y="407" text-anchor="middle" class="rl">university AI initiative &#183; $4M</text>

  <line x1="508" y1="426" x2="508" y2="450" stroke="#A8461E" stroke-width="2"/>
  <circle cx="508" cy="456" r="4.5" fill="#A8461E"/>
  <text x="496" y="458" text-anchor="end" class="pl">Laramie</text>

  <line x1="574" y1="426" x2="574" y2="470" stroke="#A8461E" stroke-width="2"/>
  <circle cx="574" cy="476" r="4.5" fill="#A8461E"/>
  <text x="562" y="486" text-anchor="end" class="pl">Cheyenne</text>

</svg>
